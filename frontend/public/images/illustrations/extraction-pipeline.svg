<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0F172A"/>
  
  <!-- Title -->
  <text x="600" y="60" font-family="system-ui" font-size="28" font-weight="800" fill="#E2E8F0" text-anchor="middle">How TeraPlayer Works — Extraction Pipeline</text>
  <text x="600" y="90" font-family="system-ui" font-size="14" fill="#94A3B8" text-anchor="middle">Multi-layered architecture for reliable TeraBox link resolution</text>
  
  <!-- User input -->
  <rect x="50" y="130" width="200" height="100" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="150" cy="160" r="24" fill="#3B82F6" fill-opacity="0.2"/>
  <path d="M135 160 L147 172 L165 152" stroke="#3B82F6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="210" font-family="system-ui" font-size="14" font-weight="600" fill="#3B82F6" text-anchor="middle">Your Link</text>
  <text x="150" y="230" font-family="system-ui" font-size="11" fill="#94A3B8" text-anchor="middle">Paste TeraBox share URL</text>
  
  <!-- Arrow -->
  <path d="M250 180 L350 180" stroke="#3B82F6" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
  </defs>
  
  <!-- Layer 1: Native HTTP Scraper -->
  <rect x="370" y="110" width="260" height="140" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <rect x="390" y="130" width="220" height="40" rx="8" fill="#10B981" fill-opacity="0.2"/>
  <text x="500" y="158" font-family="system-ui" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">Layer 1: Native HTTP</text>
  <text x="500" y="178" font-family="system-ui" font-size="11" fill="#94A3B8" text-anchor="middle">Direct API calls to TeraBox</text>
  <text x="500" y="194" font-family="system-ui" font-size="11" fill="#94A3B8" text-anchor="middle">Fast • Lightweight • No browser</text>
  <rect x="400" y="210" width="200" height="30" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-dasharray="4 4"/>
  <text x="500" y="232" font-family="system-ui" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">✓ Success → Return data</text>
  
  <!-- Arrow down -->
  <path d="M500 250 L500 300" stroke="#10B981" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 2: Cloudflare Worker -->
  <rect x="370" y="310" width="260" height="140" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="390" y="330" width="220" height="40" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="500" y="358" font-family="system-ui" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">Layer 2: Cloudflare Worker</text>
  <text x="500" y="378" font-family="system-ui" font-size="11" fill="#94A3B8" text-anchor="middle">Geo-distributed edge extraction</text>
  <text x="500" y="394" font-family="system-ui" font-size="11" fill="#94A3B8" text-anchor="middle">Retries • Fallbacks • CDN URLs</text>
  <rect x="400" y="410" width="200" height="30" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-dasharray="4 4"/>
  <text x="500" y="432" font-family="system-ui" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">✓ Success → Return data</text>
  
  <!-- Arrow down -->
  <path d="M500 450 L500 500" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 3: Browser Extension (User's browser) -->
  <rect x="370" y="510" width="260" height="120" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="390" y="530" width="220" height="40" rx="8" fill="#8B5CF6" fill-opacity="0.2"/>
  <text x="500" y="558" font-family="system-ui" font-size="13" font-weight="700" fill="#8B5CF6" text-anchor="middle">Layer 3: Browser Extension</text>
  <text x="500" y="578" font-family="system-ui" font-size="11" fill="#94A3B8" text-anchor="middle">Runs in YOUR browser on terabox.com</text>
  <rect x="400" y="590" width="200" height="30" rx="6" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-dasharray="4 4"/>
  <text x="500" y="612" font-family="system-ui" font-size="11" font-weight="600" fill="#8B5CF6" text-anchor="middle">✓ Success → Return data</text>
  
  <!-- Right side: Community APIs -->
  <rect x="680" y="110" width="470" height="520" rx="16" fill="#1E293B" stroke="#64748B" stroke-width="1" stroke-dasharray="8 4"/>
  <rect x="700" y="130" width="430" height="40" rx="8" fill="#64748B" fill-opacity="0.15"/>
  <text x="915" y="158" font-family="system-ui" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle">Community Fallback APIs</text>
  
  <!-- API cards -->
  <g fill="#334155" stroke="#475569">
    <rect x="720" y="190" width="410" height="100" rx="10"/>
    <circle cx="760" cy="220" r="18" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6"/>
    <text x="760" y="225" font-family="system-ui" font-size="18" fill="#8B5CF6" text-anchor="middle">xAPI</text>
    <text x="820" y="210" font-family="system-ui" font-size="14" font-weight="600" fill="#E2E8F0">xAPIverse</text>
    <text x="820" y="230" font-family="system-ui" font-size="11" fill="#94A3B8">Primary community resolver</text>
    <text x="820" y="246" font-family="system-ui" font-size="11" fill="#64748B">Requires API key • Rate limited</text>
    <rect x="820" y="264" width="120" height="20" rx="4" fill="#10B981" fill-opacity="0.2"/>
    <text x="880" y="278" font-family="system-ui" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">Configured</text>
    
    <rect x="720" y="310" width="410" height="100" rx="10"/>
    <circle cx="760" cy="340" r="18" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B"/>
    <text x="760" y="345" font-family="system-ui" font-size="18" fill="#F59E0B" text-anchor="middle">TDL</text>
    <text x="820" y="330" font-family="system-ui" font-size="14" font-weight="600" fill="#E2E8F0">teradl / hnn</text>
    <text x="820" y="350" font-family="system-ui" font-size="11" fill="#94A3B8">Alternative extractors</text>
    <text x="820" y="366" font-family="system-ui" font-size="11" fill="#64748B">No auth • Best effort</text>
    <rect x="820" y="384" width="120" height="20" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="880" y="398" font-family="system-ui" font-size="10" font-weight="600" fill="#F59E0B" text-anchor="middle">Available</text>
    
    <rect x="720" y="430" width="410" height="100" rx="10"/>
    <circle cx="760" cy="460" r="18" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444"/>
    <text x="760" y="465" font-family="system-ui" font-size="18" fill="#EF4444" text-anchor="middle">✕</text>
    <text x="820" y="450" font-family="system-ui" font-size="14" font-weight="600" fill="#E2E8F0">Custom Workers</text>
    <text x="820" y="470" font-family="system-ui" font-size="11" fill="#94A3B8">Self-hosted fallback endpoints</text>
    <text x="820" y="486" font-family="system-ui" font-size="11" fill="#64748B">Optional • User-provided URLs</text>
    <rect x="820" y="504" width="120" height="20" rx="4" fill="#EF4444" fill-opacity="0.2"/>
    <text x="880" y="518" font-family="system-ui" font-size="10" font-weight="600" fill="#EF4444" text-anchor="middle">Not Set</text>
  </g>
  
  <!-- Bottom: Streaming Proxy -->
  <rect x="50" y="560" width="1100" height="80" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="80" y="570" width="60" height="60" rx="10" fill="#3B82F6" fill-opacity="0.2"/>
  <text x="110" y="612" font-family="system-ui" font-size="24" fill="#3B82F6" text-anchor="middle">▶</text>
  <text x="160" y="595" font-family="system-ui" font-size="14" font-weight="600" fill="#E2E8F0">Streaming Proxy (HLS.js)</text>
  <text x="160" y="615" font-family="system-ui" font-size="11" fill="#94A3B8">SSRF-protected • Range requests • NDUS cookie injection • Referer spoofing</text>
  <text x="1050" y="615" font-family="system-ui" font-size="12" font-weight="600" fill="#3B82F6" text-anchor="end">Your Browser → TeraPlayer Proxy → TeraBox CDN</text>
  <path d="M1050 600 L1150 600" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="50" y="650" width="1100" height="20" rx="4" fill="transparent"/>
  <circle cx="70" cy="660" r="6" fill="#10B981"/>
  <text x="85" y="664" font-family="system-ui" font-size="10" fill="#10B981">Layer 1: Native HTTP</text>
  <circle cx="250" cy="660" r="6" fill="#F59E0B"/>
  <text x="265" y="664" font-family="system-ui" font-size="10" fill="#F59E0B">Layer 2: CF Worker</text>
  <circle cx="440" cy="660" r="6" fill="#8B5CF6"/>
  <text x="455" y="664" font-family="system-ui" font-size="10" fill="#8B5CF6">Layer 3: Browser Ext</text>
  <circle cx="650" cy="660" r="6" fill="#64748B"/>
  <text x="665" y="664" font-family="system-ui" font-size="10" fill="#64748B">Community APIs</text>
  <circle cx="850" cy="660" r="6" fill="#3B82F6"/>
  <text x="865" y="664" font-family="system-ui" font-size="10" fill="#3B82F6">Streaming Proxy</text>
</svg>