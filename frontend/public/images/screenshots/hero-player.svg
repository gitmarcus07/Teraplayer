  <!-- TeraPlayer branding -->
  <text x="600" y="620" font-family="system-ui" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="middle">TeraPlayer — TeraBox Video Player</text>
  <text x="600" y="640" font-family="system-ui" font-size="11" fill="#64748B" text-anchor="middle">Stream supported public TeraBox links directly in your browser</text>
