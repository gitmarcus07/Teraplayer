<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0F172A"/>
  <rect x="100" y="60" width="1000" height="50" rx="8" fill="#1E293B" stroke="#334155"/>
  <rect x="120" y="72" width="300" height="26" rx="4" fill="#334155"/>
  <rect x="120" y="100" width="150" height="16" rx="3" fill="#475569"/>
  <rect x="120" y="124" width="200" height="12" rx="3" fill="#334155"/>
  
  <!-- Video player area -->
  <rect x="100" y="140" width="1000" height="420" rx="8" fill="#000000" stroke="#334155"/>
  <circle cx="600" cy="350" r="40" fill="#3B82F6" fill-opacity="0.3" stroke="#3B82F6" stroke-width="2"/>
  <polygon points="588,340 588,360 612,350" fill="#3B82F6"/>
  
  <!-- Progress bar -->
  <rect x="140" y="530" width="920" height="6" rx="3" fill="#1E293B"/>
  <rect x="140" y="530" width="460" height="6" rx="3" fill="#3B82F6"/>
  
  <!-- Controls -->
  <rect x="140" y="550" width="920" height="40" rx="8" fill="#1E293B"/>
  <circle cx="200" cy="570" r="16" fill="#3B82F6"/>
  <polygon points="192,560 192,580 212,570" fill="white"/>
  <rect x="240" y="562" width="80" height="16" rx="3" fill="#334155"/>
  <text x="280" y="574" font-family="system-ui" font-size="12" fill="#94A3B8">00:15</text>
  <text x="330" y="574" font-family="system-ui" font-size="12" fill="#64748B">/</text>
  <text x="340" y="574" font-family="system-ui" font-size="12" fill="#94A3B8">04:32</text>
  
  <!-- Quality indicator -->
